# Persistent TensorBoard + HTTPRoute for AI-Cluster gateway.
# UI: https://mjlab.4ai.systems
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mjlab-tensorboard
  namespace: mjlab
  labels:
    app.kubernetes.io/name: mjlab-tensorboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mjlab-tensorboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mjlab-tensorboard
    spec:
      containers:
        - name: tensorboard
          image: ghcr.io/mujocolab/mjlab:latest
          imagePullPolicy: IfNotPresent
          command:
            - uv
            - run
            - tensorboard
          args:
            - --logdir=/logs
            - --bind_all
            - --port=6006
            - --reload_interval=30
          ports:
            - containerPort: 6006
              name: http
          volumeMounts:
            - name: logs
              mountPath: /logs
      volumes:
        - name: logs
          persistentVolumeClaim:
            claimName: mjlab-logs
---
apiVersion: v1
kind: Service
metadata:
  name: mjlab-tensorboard
  namespace: mjlab
  labels:
    app.kubernetes.io/name: mjlab-tensorboard
spec:
  selector:
    app.kubernetes.io/name: mjlab-tensorboard
  ports:
    - name: http
      port: 80
      targetPort: 6006
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mjlab-tensorboard
  namespace: mjlab
spec:
  parentRefs:
    - name: gateway
      namespace: gateway
      sectionName: websecure
  hostnames:
    - mjlab.4ai.systems
  rules:
    - backendRefs:
        - name: mjlab-tensorboard
          port: 80
