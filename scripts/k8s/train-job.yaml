# 4-GPU training Job for AI-Cluster. Re-run after code changes:
#   kubectl -n mjlab delete job mjlab-train --ignore-not-found
#   kubectl apply -k scripts/k8s/
apiVersion: batch/v1
kind: Job
metadata:
  name: mjlab-train
  namespace: mjlab
  labels:
    app.kubernetes.io/name: mjlab-train
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mjlab-train
    spec:
      restartPolicy: Never
      runtimeClassName: nvidia
      priorityClassName: training-medium
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: train
          image: ghcr.io/mujocolab/mjlab:latest
          imagePullPolicy: Always
          command:
            - /scripts/entrypoint.sh
          env:
            - name: MUJOCO_GL
              value: egl
            - name: UV_LINK_MODE
              value: copy
          envFrom:
            - configMapRef:
                name: mjlab-train-config
          resources:
            requests:
              nvidia.com/gpu: "4"
            limits:
              nvidia.com/gpu: "4"
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: logs
              mountPath: /logs
            - name: entrypoint
              mountPath: /scripts
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: mjlab-workspace
        - name: logs
          persistentVolumeClaim:
            claimName: mjlab-logs
        - name: entrypoint
          configMap:
            name: mjlab-entrypoint
            defaultMode: 0755
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
