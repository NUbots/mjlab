# Volcano Job template for mjlab grid-search cells. Do not apply directly.
# Generate manifests with scripts/k8s/gen-gridsearch.sh (see --help).
apiVersion: batch.volcano.sh/v1alpha1
kind: Job
metadata:
  name: ${JOB_NAME}
  namespace: mjlab
  labels:
    app.kubernetes.io/name: mjlab-train
    app.kubernetes.io/component: gridsearch
    mjlab/gridsearch: "true"
    mjlab/variant: ${MJLAB_VARIANT}
spec:
  schedulerName: volcano
  queue: mjlab-train
  minAvailable: ${JOB_REPLICAS}
  plugins:
    env: []
    svc: []
  maxRetry: 0
  ttlSecondsAfterFinished: 86400
  tasks:
    - name: train
      replicas: ${JOB_REPLICAS}
      minAvailable: ${JOB_REPLICAS}
      template:
        metadata:
          labels:
            app.kubernetes.io/name: mjlab-train
            app.kubernetes.io/component: gridsearch
            mjlab/gridsearch: "true"
            mjlab/variant: ${MJLAB_VARIANT}
        spec:
          restartPolicy: Never
          runtimeClassName: nvidia
          priorityClassName: training-medium
          tolerations:
            - key: nvidia.com/gpu
              operator: Exists
              effect: NoSchedule
          containers:
            - name: train
              image: ghcr.io/mujocolab/mjlab:latest
              imagePullPolicy: Always
              command:
                - /scripts/entrypoint.sh
              env:
                - name: MUJOCO_GL
                  value: egl
                - name: NUM_ENVS
                  value: "${NUM_ENVS}"
                - name: MULTINODE
                  value: "${MULTINODE}"
                - name: NNODES
                  value: "${JOB_REPLICAS}"
                - name: MJLAB_LOG_STAMP
                  value: "${MJLAB_LOG_STAMP}"
                - name: UV_LINK_MODE
                  value: copy
                - name: MJLAB_VARIANT
                  value: "${MJLAB_VARIANT}"
                - name: JOULE_W
                  value: "${JOULE_W}"
                - name: STAND_W
                  value: "${STAND_W}"
                - name: PHASE_C_FRAC
                  value: "${PHASE_C_FRAC}"
                # Curriculum phase boundaries are derived from PHASE_ITERATIONS,
                # decoupled from MAX_ITERATIONS (which only drives the training
                # length). Freeze at 1250 so resumed/extended runs keep the same
                # absolute phase timing.
                - name: PHASE_ITERATIONS
                  value: "${PHASE_ITERATIONS}"
                # Training length (additive on resume: rsl-rl runs this many more
                # iterations starting from the checkpoint's iteration). Overrides
                # the configmap default per cell.
                - name: MAX_ITERATIONS
                  value: "${MAX_ITERATIONS}"
                # New clock_anneal variant knobs read by the factory.
                - name: SILENCE_CLOCK
                  value: "${SILENCE_CLOCK}"
                - name: CURRENT_OBS
                  value: "${CURRENT_OBS}"
                - name: PHASE_DELTA_STRONG_ITERS
                  value: "${PHASE_DELTA_STRONG_ITERS}"
                - name: PHASE_DELTA_STRONG_W
                  value: "${PHASE_DELTA_STRONG_W}"
                - name: PHASE_DELTA_TAIL_W
                  value: "${PHASE_DELTA_TAIL_W}"
                - name: UPRIGHT_W
                  value: "${UPRIGHT_W}"
                - name: PROGRESS_BACKSLIDE_W
                  value: "${PROGRESS_BACKSLIDE_W}"
                - name: TRAINING_REGIME
                  value: "${TRAINING_REGIME}"
                - name: HARD_COMPONENTS
                  value: "${HARD_COMPONENTS}"
                - name: CONT_BASE_STEP
                  value: "${CONT_BASE_STEP}"
                - name: CRITIC_HEIGHT_SCAN
                  value: "${CRITIC_HEIGHT_SCAN}"
                - name: TASK
                  value: "${TASK}"
                - name: RESAMPLE_MIN
                  value: "${RESAMPLE_MIN}"
                - name: GAIT_PERIOD
                  value: "${GAIT_PERIOD}"
                - name: SWING_TARGET_HEIGHT
                  value: "${SWING_TARGET_HEIGHT}"
                - name: FLATTEN_PHASE_C
                  value: "${FLATTEN_PHASE_C}"
                - name: PHASE_C_WARMUP
                  value: "${PHASE_C_WARMUP}"
                - name: ALIVE_W
                  value: "${ALIVE_W}"
                - name: JOINT_ACC_W
                  value: "${JOINT_ACC_W}"
                - name: PHASE_DELTA_W
                  value: "${PHASE_DELTA_W}"
                - name: FEET_MIN_SEP
                  value: "${FEET_MIN_SEP}"
                - name: FEET_MIN_SEP_W
                  value: "${FEET_MIN_SEP_W}"
                - name: FEET_MIN_SEP_SHARPNESS
                  value: "${FEET_MIN_SEP_SHARPNESS}"
                - name: TRACK_LIN_W
                  value: "${TRACK_LIN_W}"
                - name: TRACK_ANG_W
                  value: "${TRACK_ANG_W}"
                - name: AIR_TIME_W
                  value: "${AIR_TIME_W}"
                - name: MIRROR_AUG
                  value: "${MIRROR_AUG}"
                - name: FOOT_FLAT_W
                  value: "${FOOT_FLAT_W}"
                - name: FOOT_FLAT_ONESIDED
                  value: "${FOOT_FLAT_ONESIDED}"
                - name: CLEARANCE_PER_CORNER
                  value: "${CLEARANCE_PER_CORNER}"
                - name: SWING_HEIGHT_SOURCE
                  value: "${SWING_HEIGHT_SOURCE}"
                - name: CLEARANCE_TARGET_HEIGHT
                  value: "${CLEARANCE_TARGET_HEIGHT}"
                - name: CLEARANCE_TARGET_FROM_SWING
                  value: "${CLEARANCE_TARGET_FROM_SWING}"
                - name: PUSH_INTERVAL_SCALE
                  value: "${PUSH_INTERVAL_SCALE}"
                - name: LR_CAP
                  value: "${LR_CAP}"
                - name: LR_CAP_START_ITER
                  value: "${LR_CAP_START_ITER}"
                - name: ENTROPY_DECAY
                  value: "${ENTROPY_DECAY}"
                - name: ENTROPY_START
                  value: "${ENTROPY_START}"
                - name: ENTROPY_END
                  value: "${ENTROPY_END}"
                - name: STD_MIN
                  value: "${STD_MIN}"
                - name: GAMMA
                  value: "${GAMMA}"
                - name: ADAPTIVE_COMMANDS
                  value: "${ADAPTIVE_COMMANDS}"
                - name: ADAPTIVE_PUSHES
                  value: "${ADAPTIVE_PUSHES}"
                - name: PENALTY_GATE
                  value: "${PENALTY_GATE}"
                - name: ADAPTIVE_CMD_LMAX
                  value: "${ADAPTIVE_CMD_LMAX}"
                - name: ADAPTIVE_PUSH_LMAX
                  value: "${ADAPTIVE_PUSH_LMAX}"
                - name: COMPETENCE_PROMOTE_TRACK_ERR
                  value: "${COMPETENCE_PROMOTE_TRACK_ERR}"
                - name: COMPETENCE_DEMOTE_TRACK_ERR
                  value: "${COMPETENCE_DEMOTE_TRACK_ERR}"
                - name: COMPETENCE_PROMOTE_ATTAIN
                  value: "${COMPETENCE_PROMOTE_ATTAIN}"
                - name: COMPETENCE_DEMOTE_ATTAIN
                  value: "${COMPETENCE_DEMOTE_ATTAIN}"
                - name: COMPETENCE_PROMOTE_WOBBLE
                  value: "${COMPETENCE_PROMOTE_WOBBLE}"
                - name: COMPETENCE_DEMOTE_WOBBLE
                  value: "${COMPETENCE_DEMOTE_WOBBLE}"
                - name: COMPETENCE_PROMOTE_FELL
                  value: "${COMPETENCE_PROMOTE_FELL}"
                - name: COMPETENCE_DEMOTE_FELL
                  value: "${COMPETENCE_DEMOTE_FELL}"
                - name: COMPETENCE_DEMOTE_FAST_FELL
                  value: "${COMPETENCE_DEMOTE_FAST_FELL}"
                - name: COMPETENCE_TOP_STREAK
                  value: "${COMPETENCE_TOP_STREAK}"
                - name: CURRICULUM_STYLE
                  value: "${CURRICULUM_STYLE}"
                - name: AIMD_ALPHA
                  value: "${AIMD_ALPHA}"
                - name: AIMD_BETA
                  value: "${AIMD_BETA}"
                - name: AIMD_CONGEST_BAR
                  value: "${AIMD_CONGEST_BAR}"
                - name: AIMD_EMERGENCY_BAR
                  value: "${AIMD_EMERGENCY_BAR}"
                - name: AIMD_GATE_ATTAIN
                  value: "${AIMD_GATE_ATTAIN}"
                - name: TRACK_WATCHDOG
                  value: "${TRACK_WATCHDOG}"
                - name: WATCHDOG_ARM_ABOVE
                  value: "${WATCHDOG_ARM_ABOVE}"
                - name: WATCHDOG_FAIL_BELOW
                  value: "${WATCHDOG_FAIL_BELOW}"
                - name: WATCHDOG_PERSIST_ITERS
                  value: "${WATCHDOG_PERSIST_ITERS}"
                - name: PUSH_COHORT_FRAC
                  value: "${PUSH_COHORT_FRAC}"
                - name: FRONTIER_HAZARD_BAR
                  value: "${FRONTIER_HAZARD_BAR}"
                - name: JOULE_LAMBDA_SHADOW
                  value: "${JOULE_LAMBDA_SHADOW}"
                - name: LAMBDA_CAP
                  value: "${LAMBDA_CAP}"
                - name: LAMBDA_RAMP_ITERS
                  value: "${LAMBDA_RAMP_ITERS}"
                - name: JOULE_LAMBDA_LIVE
                  value: "${JOULE_LAMBDA_LIVE}"
                - name: COMMAND_GEOMETRY
                  value: "${COMMAND_GEOMETRY}"
                - name: AIMD_BETA_ARREST
                  value: "${AIMD_BETA_ARREST}"
                - name: AIMD_ENVELOPE_SCALE
                  value: "${AIMD_ENVELOPE_SCALE}"
                - name: AIMD_PUSH_CONGEST_BAR
                  value: "${AIMD_PUSH_CONGEST_BAR}"
                - name: AIMD_PUSH_GATE_EXCESS
                  value: "${AIMD_PUSH_GATE_EXCESS}"
                - name: AIMD_ATTAIN_SLIDE_FRAC
                  value: "${AIMD_ATTAIN_SLIDE_FRAC}"
                - name: LANDING_ANNEAL
                  value: "${LANDING_ANNEAL}"
                - name: COMPETENCE_COOLDOWN_ITERS
                  value: "${COMPETENCE_COOLDOWN_ITERS}"
                - name: LINK_MASS_SCALE_MIN
                  value: "${LINK_MASS_SCALE_MIN}"
                - name: LINK_MASS_SCALE_MAX
                  value: "${LINK_MASS_SCALE_MAX}"
                - name: PAYLOAD_KG_MIN
                  value: "${PAYLOAD_KG_MIN}"
                - name: PAYLOAD_KG_MAX
                  value: "${PAYLOAD_KG_MAX}"
                - name: EFFORT_LO
                  value: "${EFFORT_LO}"
                - name: EFFORT_HI
                  value: "${EFFORT_HI}"
                - name: SEED
                  value: "${SEED}"
                - name: LOGGER
                  value: "${LOGGER}"
                - name: EXPERIMENT_NAME
                  value: "${EXPERIMENT_NAME}"
                - name: RUN_NAME
                  value: "${RUN_NAME}"
                - name: WANDB_PROJECT
                  value: "${WANDB_PROJECT}"
                - name: WANDB_TAGS
                  value: "${WANDB_TAGS}"
                # Data-parallel: use every GPU the pod is granted (4 -> torchrunx).
                - name: GPU_IDS
                  value: "all"
                # Pin commit + force fresh, isolated runs regardless of the shared
                # mjlab-train-config configmap (which is rewritten by other tooling).
                # NOTE: c04e4ec adds the actuator_current (CURRENT_OBS) and
                # clock-silence (SILENCE_CLOCK) clock_anneal variants, decouples the
                # curriculum phase timing via PHASE_ITERATIONS, and rescales the
                # command_vel curriculum so the wide backward/strafe/yaw ranges are
                # reached early in a run (yaw ramps to +/-0.5 by ~iter 250 so the
                # policy learns to rotate).
                - name: GIT_COMMIT
                  value: "${GIT_COMMIT}"
                # Resume/continuation: set per cell by gen-gridsearch.sh. When
                # RESUME=true the run continues from WANDB_RUN_PATH's latest
                # checkpoint (rsl-rl adds MAX_ITERATIONS more iterations).
                - name: RESUME
                  value: "${RESUME}"
                - name: WANDB_RUN_PATH
                  value: "${WANDB_RUN_PATH}"
                - name: WANDB_RUN_NAME
                  value: "${WANDB_RUN_NAME}"
              envFrom:
                - configMapRef:
                    name: mjlab-train-config
                - secretRef:
                    name: mjlab-wandb
                    optional: true
              resources:
                requests:
                  nvidia.com/gpu: "4"
                limits:
                  nvidia.com/gpu: "4"
              volumeMounts:
                - name: workspace
                  mountPath: /workspace
                - name: logs
                  mountPath: /logs
                - name: entrypoint
                  mountPath: /scripts
                - name: dshm
                  mountPath: /dev/shm
          volumes:
            # Per-pod clone instead of the shared mjlab-workspace PVC: that PVC is
            # longhorn-local pinned to node munin, which forces every job onto munin
            # and leaves hugin idle. emptyDir lets each 4-GPU job land on any GPU node
            # (one on munin, one on hugin) and clone the repo fresh at the pinned commit.
            - name: workspace
              emptyDir: {}
            - name: logs
              persistentVolumeClaim:
                claimName: mjlab-logs
            - name: entrypoint
              configMap:
                name: mjlab-entrypoint
                defaultMode: 0755
            - name: dshm
              emptyDir:
                medium: Memory
                sizeLimit: 16Gi
