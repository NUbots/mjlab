# Volcano Job template for mjlab grid-search cells. Do not apply directly.
# Generate manifests with scripts/k8s/gen-gridsearch.sh (see --help).
apiVersion: batch.volcano.sh/v1alpha1
kind: Job
metadata:
  name: ${JOB_NAME}
  namespace: mjlab
  labels:
    app.kubernetes.io/name: mjlab-train
    app.kubernetes.io/component: gridsearch
    mjlab/gridsearch: "true"
    mjlab/variant: ${MJLAB_VARIANT}
spec:
  schedulerName: volcano
  queue: mjlab-train
  minAvailable: 1
  maxRetry: 0
  ttlSecondsAfterFinished: 86400
  tasks:
    - name: train
      replicas: 1
      minAvailable: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: mjlab-train
            app.kubernetes.io/component: gridsearch
            mjlab/gridsearch: "true"
            mjlab/variant: ${MJLAB_VARIANT}
        spec:
          restartPolicy: Never
          runtimeClassName: nvidia
          priorityClassName: training-medium
          tolerations:
            - key: nvidia.com/gpu
              operator: Exists
              effect: NoSchedule
          containers:
            - name: train
              image: ghcr.io/mujocolab/mjlab:latest
              imagePullPolicy: Always
              command:
                - /scripts/entrypoint.sh
              env:
                - name: MUJOCO_GL
                  value: egl
                - name: UV_LINK_MODE
                  value: copy
                - name: MJLAB_VARIANT
                  value: "${MJLAB_VARIANT}"
                - name: JOULE_W
                  value: "${JOULE_W}"
                - name: PHASE_C_FRAC
                  value: "${PHASE_C_FRAC}"
                - name: GAIT_PERIOD
                  value: "${GAIT_PERIOD}"
                - name: EFFORT_LO
                  value: "${EFFORT_LO}"
                - name: EFFORT_HI
                  value: "${EFFORT_HI}"
                - name: SEED
                  value: "${SEED}"
                - name: LOGGER
                  value: "${LOGGER}"
                - name: EXPERIMENT_NAME
                  value: "${EXPERIMENT_NAME}"
                - name: RUN_NAME
                  value: "${RUN_NAME}"
                - name: WANDB_PROJECT
                  value: "${WANDB_PROJECT}"
                - name: WANDB_TAGS
                  value: "${WANDB_TAGS}"
                - name: GPU_IDS
                  value: "0"
              envFrom:
                - configMapRef:
                    name: mjlab-train-config
                - secretRef:
                    name: mjlab-wandb
                    optional: true
              resources:
                requests:
                  nvidia.com/gpu: "1"
                limits:
                  nvidia.com/gpu: "1"
              volumeMounts:
                - name: workspace
                  mountPath: /workspace
                - name: logs
                  mountPath: /logs
                - name: entrypoint
                  mountPath: /scripts
                - name: dshm
                  mountPath: /dev/shm
          volumes:
            - name: workspace
              persistentVolumeClaim:
                claimName: mjlab-workspace
            - name: logs
              persistentVolumeClaim:
                claimName: mjlab-logs
            - name: entrypoint
              configMap:
                name: mjlab-entrypoint
                defaultMode: 0755
            - name: dshm
              emptyDir:
                medium: Memory
                sizeLimit: 16Gi
